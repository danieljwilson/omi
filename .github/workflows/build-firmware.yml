name: Build OMI Firmware

on:
  push:
    branches: [led-control]
    paths:
      - 'omi/firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install nrfutil and toolchain
        run: |
          wget -q https://developer.nordicsemi.com/.pc-tools/nrfutil/x64-linux/nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/
          nrfutil install toolchain-manager
          nrfutil toolchain-manager install --ncs-version v2.7.0

      - name: Checkout OMI repo (upstream, unmodified)
        uses: actions/checkout@v4
        with:
          repository: BasedHardware/omi
          path: omi-repo

      - name: Initialize NCS workspace
        run: |
          mkdir -p ncs && cd ncs
          nrfutil toolchain-manager launch --ncs-version v2.7.0 -- west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.7.0

      - name: West update
        working-directory: ncs
        run: nrfutil toolchain-manager launch --ncs-version v2.7.0 -- west update --narrow -o=--depth=1
        timeout-minutes: 30

      - name: Prepare config
        working-directory: omi-repo/omi/firmware/omi
        run: |
          cp omi.conf prj.conf
          # MCUBOOT_NRF53_MULTI_IMAGE_UPDATE doesn't exist in NCS v2.7.0
          # Comment it out — UPDATEABLE_IMAGES=2 still enables dual-core update
          sed -i '/^SB_CONFIG_MCUBOOT_NRF53_MULTI_IMAGE_UPDATE/d' sysbuild.conf
          echo "--- sysbuild.conf after patching ---"
          cat sysbuild.conf

      - name: Build firmware (unmodified upstream)
        working-directory: ncs
        run: |
          nrfutil toolchain-manager launch --ncs-version v2.7.0 -- \
            west build -b omi/nrf5340/cpuapp ${{ github.workspace }}/omi-repo/omi/firmware/omi \
              --sysbuild \
              -- -DBOARD_ROOT=${{ github.workspace }}/omi-repo/omi/firmware
        timeout-minutes: 15

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: omi-firmware-dfu
          path: ncs/build/dfu_application.zip
          if-no-files-found: error
