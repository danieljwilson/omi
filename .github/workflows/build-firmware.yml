name: Build OMI Firmware (offline-recording)

on:
  push:
    branches:
      - offline-recording
      - 'wedge-forensics-*'
    paths:
      - 'omi/firmware/**'
      - '.github/workflows/build-firmware.yml'
  # Gate any firmware-touching PR (incl. the merge of a pairent.N branch back
  # into offline-recording) so the netcore-config check below can't be skipped.
  pull_request:
    paths:
      - 'omi/firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install nrfutil and toolchain
        run: |
          wget -q https://developer.nordicsemi.com/.pc-tools/nrfutil/x64-linux/nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/
          nrfutil install toolchain-manager
          nrfutil toolchain-manager install --ncs-version v2.9.0

      - name: Checkout patched OMI firmware
        uses: actions/checkout@v6
        with:
          path: omi-repo

      - name: Initialize NCS workspace
        run: |
          mkdir -p ncs && cd ncs
          nrfutil toolchain-manager launch --ncs-version v2.9.0 -- west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.9.0

      - name: West update
        working-directory: ncs
        run: nrfutil toolchain-manager launch --ncs-version v2.9.0 -- west update --narrow -o=--depth=1
        timeout-minutes: 30

      - name: Prepare config
        working-directory: omi-repo/omi/firmware/omi
        run: |
          cp omi.conf prj.conf
          # Upstream committed a gitlink without a .gitmodules entry
          # (omiGlass PlatformIO libdeps); checkout's post-job cleanup trips
          # on it with a git exit-128 warning. Drop it from the index.
          git -C "${{ github.workspace }}/omi-repo" rm -q --cached omiGlass/firmware/.pio/libdeps/seeed_xiao_esp32s3/libopus || true
          # mcuboot.conf symlink bug (OMI issue #6350) is fixed upstream;
          # sanity-check it is a regular file, not a symlink.
          if [ -L sysbuild/mcuboot.conf ]; then
            echo "sysbuild/mcuboot.conf is a symlink again — apply the #6350 fix" && exit 1
          fi
          # Verify Pairent patches are present
          echo "--- Verifying Pairent patches ---"
          grep -q "led_control_write_handler" src/lib/core/transport.c && echo "LED patch: transport.c OK" || (echo "LED patch MISSING from transport.c" && exit 1)
          grep -q "led_app_override" src/main.c && echo "LED patch: main.c OK" || (echo "LED patch MISSING from main.c" && exit 1)
          grep -q "offline_rec_enabled" src/lib/core/transport.c && echo "SD-primary patch: transport.c OK" || (echo "SD-primary patch MISSING from transport.c" && exit 1)
          test -f src/lib/core/offline_rec.c && echo "offline_rec module OK" || (echo "offline_rec.c MISSING" && exit 1)

      - name: Build firmware (offline-recording)
        working-directory: ncs
        run: |
          # build.log feeds the RAM guard below and ships in the buildinfo
          # artifact. The default `run` shell has no pipefail, so set it or a
          # failed west build would be masked by tee's exit status.
          set -o pipefail
          nrfutil toolchain-manager launch --ncs-version v2.9.0 -- \
            west build -b omi/nrf5340/cpuapp ${{ github.workspace }}/omi-repo/omi/firmware/omi \
              --sysbuild \
              -- -DBOARD_ROOT=${{ github.workspace }}/omi-repo/omi/firmware \
            2>&1 | tee build.log
        timeout-minutes: 15

      - name: RAM guard (app-core Memory region table)
        working-directory: ncs
        run: |
          # Sysbuild links four images (mcuboot, omi, b0n, ipc_radio) and each
          # prints its own "Memory region" table; mcuboot's RAM region is also
          # 440 KB, so the region size cannot identify the app core. Anchor on
          # the post-link line that names build/omi/zephyr/zephyr.elf and take
          # the RAM line that precedes it. pairent.10 sat at 98.35% (7,456 B
          # headroom); 99% is the line that would have caught a +6,800 B fix.
          python3 - build.log <<'EOF'
          import os, re, sys
          MULT = {"B": 1, "KB": 1024, "MB": 1024 ** 2, "GB": 1024 ** 3}
          RAM = re.compile(r"^\s*RAM:\s+(\d+)\s+(B|KB|MB|GB)\s+(\d+)\s+(B|KB|MB|GB)\s+([\d.]+)%")
          ANCHOR = re.compile(r"Generating files from \S*/build/omi/zephyr/zephyr\.elf\b")
          last = None
          with open(sys.argv[1], errors="replace") as f:
              for line in f:
                  m = RAM.match(line)
                  if m:
                      last = m
                  elif ANCHOR.search(line):
                      break
              else:
                  sys.exit("RAM guard: app-core post-link line (build/omi/zephyr/zephyr.elf) not found in build.log")
          if last is None:
              sys.exit("RAM guard: no RAM line precedes the app-core post-link line")
          used = int(last[1]) * MULT[last[2]]
          size = int(last[3]) * MULT[last[4]]
          headroom = size - used
          pct = 100.0 * used / size
          ram_line = last.group(0).strip()
          print(f"app-core {ram_line}")
          print(f"app-core RAM used={used} B region={size} B headroom={headroom} B ({pct:.2f}%)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## App-core RAM (build/omi)\n\n")
              s.write("| used (B) | region (B) | headroom (B) | used |\n|---:|---:|---:|---:|\n")
              s.write(f"| {used} | {size} | {headroom} | {pct:.2f}% |\n\n`{ram_line}`\n")
          if pct > 99.0:
              sys.exit(f"RAM guard: app-core RAM {pct:.2f}% exceeds 99% (headroom {headroom} B)")
          EOF

      - name: Verify netcore config (ISSUES #92 wedge hardening)
        working-directory: ncs
        run: |
          CFG=build/ipc_radio/zephyr/.config
          test -f "$CFG" || { echo "netcore .config not found at $CFG"; ls build; exit 1; }
          # Nordic's overlay-bt_hci_ipc.conf merges after the project fragment
          # and would silently flip BT_CTLR_ASSERT_HANDLER back to y (spin-
          # forever on SDC assert). sysbuild.conf suppresses the overlay; this
          # gate keeps that from regressing.
          if grep -q '^CONFIG_BT_CTLR_ASSERT_HANDLER=y' "$CFG"; then
            echo "netcore BT_CTLR_ASSERT_HANDLER=y leaked back in (overlay merge order)"; exit 1
          fi
          grep -q '^CONFIG_RESET_ON_FATAL_ERROR=y' "$CFG" || { echo "netcore RESET_ON_FATAL_ERROR not enabled"; exit 1; }
          grep -q '^CONFIG_ASSERT=y' "$CFG" || { echo "netcore CONFIG_ASSERT not enabled"; exit 1; }
          # BT HCI IPC must still be fully configured by the project fragment
          grep -q '^CONFIG_IPC_RADIO_BT_HCI_IPC=y' "$CFG" || { echo "netcore lost IPC_RADIO_BT_HCI_IPC"; exit 1; }
          echo "netcore config OK"

      - name: Stage DFU package (sibling file keeps it a usable zip)
        working-directory: ncs
        run: |
          # The DFU package is itself a zip, and GitHub wraps every artifact in
          # another zip. When the inner content is a single zip, macOS Archive
          # Utility recursively auto-extracts it on download, leaving a loose
          # dfu_application/ folder instead of the dfu_application.zip that nRF
          # Connect Device Manager expects. Shipping a sibling file next to the
          # zip stops that recursion, so the download yields dfu_application.zip.
          mkdir -p dfu_out
          cp build/dfu_application.zip dfu_out/
          printf '%s\n' \
            'OMI firmware (offline-recording).' \
            '' \
            'Flash dfu_application.zip via nRF Connect Device Manager (OTA, both' \
            'cores: app + netcore). Morning only; then time-sync + a short test' \
            'recording + a drain.' \
            '' \
            'This README sits next to the zip so macOS Archive Utility does not' \
            'recursively auto-extract dfu_application.zip into a loose folder.' \
            'Use dfu_application.zip as-is.' \
            > dfu_out/README-FLASH.txt
          echo "--- staged artifact contents ---"; ls -l dfu_out

      - name: Upload DFU package
        uses: actions/upload-artifact@v7
        with:
          name: omi-firmware-offline-recording
          path: ncs/dfu_out/
          if-no-files-found: error

      # Separate artifact so the DFU zip above keeps its exact shape (see the
      # README-FLASH.txt sibling trick). App-core linker map + Kconfig + the
      # -fstack-usage output + the captured build log: the inputs for comparing
      # candidate builds by measurement. .config is a dotfile, hence
      # include-hidden-files. No retention-days: this repo is public and 90
      # days is already GitHub's maximum there; cut a Release for anything
      # that must outlive that.
      - name: Upload build info (map, .config, stack usage, build log)
        uses: actions/upload-artifact@v7
        with:
          name: omi-firmware-buildinfo
          path: |
            ncs/build/omi/zephyr/zephyr.map
            ncs/build/omi/zephyr/.config
            ncs/build/**/*.su
            ncs/build.log
          include-hidden-files: true
          if-no-files-found: error
