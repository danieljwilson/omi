name: Build OMI Firmware

on:
  push:
    branches: [led-control]
    paths:
      - 'omi/firmware/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Install west
        run: pip3 install west

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize west workspace
        run: west init -l omi/firmware/omi

      - name: West update
        run: west update --narrow -o=--depth=1
        timeout-minutes: 30

      - name: Install Python requirements
        run: |
          pip3 install -r zephyr/scripts/requirements.txt
          pip3 install -r nrf/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz -C /opt/
          /opt/zephyr-sdk-0.16.8/setup.sh -t arm-zephyr-eabi
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.16.8" >> $GITHUB_ENV

      - name: Prepare config
        working-directory: omi/firmware/omi
        run: cp omi.conf prj.conf

      - name: Build firmware
        run: |
          west build -b omi/nrf5340/cpuapp omi/firmware/omi --sysbuild -- -DBOARD_ROOT=${{ github.workspace }}/omi/firmware

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: omi-firmware-dfu
          path: build/dfu_application.zip
          if-no-files-found: error
