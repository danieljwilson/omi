name: Build OMI Firmware

on:
  push:
    branches: [led-control]
    paths:
      - 'omi/firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-wheel \
            xz-utils file make gcc gcc-multilib g++-multilib libmagic1

      - name: Install nrfutil and toolchain
        run: |
          wget -q https://developer.nordicsemi.com/.pc-tools/nrfutil/x64-linux/nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/
          nrfutil install toolchain-manager
          nrfutil toolchain-manager install --ncs-version v2.9.0

      - name: Checkout OMI repo
        uses: actions/checkout@v4
        with:
          path: omi-repo

      - name: Initialize and build
        run: |
          nrfutil toolchain-manager launch --ncs-version v2.9.0 -- bash -c '
            set -e
            mkdir -p ncs && cd ncs
            west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.9.0
            west update --narrow -o=--depth=1
            pip3 install -r zephyr/scripts/requirements.txt
            pip3 install -r nrf/scripts/requirements.txt
            cd ${{ github.workspace }}/omi-repo/omi/firmware/omi && cp omi.conf prj.conf
            cd ${{ github.workspace }}/ncs
            west build -b omi/nrf5340/cpuapp ${{ github.workspace }}/omi-repo/omi/firmware/omi \
              --sysbuild \
              -- -DBOARD_ROOT=${{ github.workspace }}/omi-repo/omi/firmware
          '
        timeout-minutes: 30

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: omi-firmware-dfu
          path: ncs/build/dfu_application.zip
          if-no-files-found: error
