name: Build OMI Firmware

on:
  push:
    branches: [led-control]
    paths:
      - 'omi/firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-wheel \
            xz-utils file make gcc gcc-multilib g++-multilib libmagic1

      - name: Install west
        run: pip3 install west

      - name: Checkout OMI repo
        uses: actions/checkout@v4
        with:
          path: omi-repo

      - name: Initialize NCS workspace
        run: |
          mkdir -p ncs
          cd ncs
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.9.0

      - name: West update
        working-directory: ncs
        run: west update --narrow -o=--depth=1
        timeout-minutes: 30

      - name: Install Python requirements
        working-directory: ncs
        run: |
          pip3 install -r zephyr/scripts/requirements.txt || true
          pip3 install -r nrf/scripts/requirements.txt || true

      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz -C /opt/
          /opt/zephyr-sdk-0.16.8/setup.sh -t arm-zephyr-eabi -t x86_64-zephyr-elf
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.16.8" >> $GITHUB_ENV

      - name: Prepare config
        working-directory: omi-repo/omi/firmware/omi
        run: cp omi.conf prj.conf

      - name: Build firmware
        working-directory: ncs
        run: |
          export ZEPHYR_BASE=${{ github.workspace }}/ncs/zephyr
          west build -b omi/nrf5340/cpuapp ${{ github.workspace }}/omi-repo/omi/firmware/omi \
            --sysbuild \
            -- -DBOARD_ROOT=${{ github.workspace }}/omi-repo/omi/firmware \
               -DCONFIG_SPI_NOR=n
        timeout-minutes: 15

      - name: Upload DFU package
        uses: actions/upload-artifact@v4
        with:
          name: omi-firmware-dfu
          path: ncs/build/dfu_application.zip
          if-no-files-found: error
