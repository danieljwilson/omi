SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/../bootloader/mcuboot/root-rsa-2048.pem"

# Dual Cores Boot
SB_CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
SB_CONFIG_SECURE_BOOT_NETCORE=y
SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES=2
SB_CONFIG_MCUBOOT_NRF53_MULTI_IMAGE_UPDATE=y
SB_CONFIG_NETCORE_APP_UPDATE=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# Pairent (ISSUES #92): suppress Nordic's overlay-bt_hci_ipc.conf for the
# netcore image. sysbuild merges that overlay AFTER our sysbuild/
# ipc_radio.conf fragment (netcore.cmake add_overlay_config appends), so its
# CONFIG_BT_CTLR_ASSERT_HANDLER=y would silently override our =n and SDC
# asserts would keep landing in the spin-forever handler. Our fragment
# already replicates everything the overlay provides (BT/HCI_RAW/IPC_RADIO_BT
# /IPC_RADIO_BT_HCI_IPC/MBOX/IPC_SERVICE/buffers) plus CONFIG_ASSERT=y.
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=n

