
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
#CONFIG_BT_CTLR_ASSERT_HANDLER=y
#CONFIG_BT_MAX_CONN=16

# Enable and adjust the below value as necessary
# CONFIG_BT_BUF_EVT_RX_COUNT=16
# CONFIG_BT_BUF_EVT_RX_SIZE=255
# CONFIG_BT_BUF_ACL_RX_SIZE=255
# CONFIG_BT_BUF_ACL_TX_SIZE=251
# CONFIG_BT_BUF_CMD_TX_SIZE=255

CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=400000

CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
#CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=1024
#CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=2048

CONFIG_BT_MAX_CONN=1

#CONFIG_ASSERT=y
#CONFIG_DEBUG_INFO=y
#CONFIG_EXCEPTION_STACK_TRACE=y

CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# Set preferred connection parameters
# 7.5ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# 30ms
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# 6 seconds
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

CONFIG_MPSL_CX=y

#Added to fix BLE crash in coex enable cases.
CONFIG_NRF_RPC=n
CONFIG_NRF_RPC_CBOR=n

# Pairent (ISSUES #92): as-built, a netcore SDC assert or fatal error lands
# in irq_lock + spin-forever — Nordic's overlay-bt_hci_ipc.conf sets
# BT_CTLR_ASSERT_HANDLER=y (whose handler spins) and RESET_ON_FATAL_ERROR
# is unset — so the BLE controller dies silently with no reset and no
# signal to the app core (the 85-min field-freeze signature). Reroute both
# to a netcore-local reset; the app core's HCI liveness probe then converts
# the stranded host into an attributed app-core reboot.
# NOTE: only effective because sysbuild.conf sets
# SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=n — otherwise Nordic's overlay
# merges after this fragment and flips BT_CTLR_ASSERT_HANDLER back to y.
# CONFIG_ASSERT=y is pinned here because it used to come from that overlay.
CONFIG_ASSERT=y
CONFIG_BT_CTLR_ASSERT_HANDLER=n
CONFIG_RESET_ON_FATAL_ERROR=y
